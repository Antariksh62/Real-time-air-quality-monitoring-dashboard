services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xmx256m -Xms256m"
    deploy:
      resources:
        limits:
          memory: 384M

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CREATE_TOPICS: "air_quality_events:1:1"
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xmx512m -Xms512m"
    deploy:
      resources:
        limits:
          memory: 768M

  spark:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: spark-streaming-app
    depends_on:
      - kafka
    environment:
      - SPARK_MASTER=local[*]
      - KAFKA_SERVER=kafka:29092
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-air_quality_db}
      - MONGO_COLLECTION=${MONGO_COLLECTION:-aggregated_metrics}
      - ALERTS_COLLECTION=${ALERTS_COLLECTION:-alerts}
      - CHECKPOINT_DIR=/app/checkpoints
    volumes:
      - ./spark_streaming_job.py:/app/spark_streaming_job.py
      - spark-checkpoints:/app/checkpoints
    command: >
      /spark/bin/spark-submit
      --master local[*]
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.3.0,org.mongodb.spark:mongo-spark-connector_2.12:10.1.1
      /app/spark_streaming_job.py
    deploy:
      resources:
        limits:
          memory: 1200M

  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    container_name: producer
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP=kafka:29092
      - KAFKA_TOPIC=air_quality_events
      - DATASET_PATH=/app/data/cpcb_indian_air_quality.csv
      - PRODUCER_INTERVAL=1.0
      - FILTER_CITIES=Pune,Mumbai,Delhi
      - REPLAY_LOOP=true
      - ENABLE_TEST_SPIKES=false
      - SPIKE_CITY=Pune
      - SPIKE_DELAY=45
      - SPIKE_DURATION=60
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 128M

  dashboard-backend:
    build:
      context: ./dashboard/backend
      dockerfile: Dockerfile
    container_name: dashboard-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-air_quality_db}
      - MONGO_COLLECTION=${MONGO_COLLECTION:-aggregated_metrics}
      - ALERTS_COLLECTION=${ALERTS_COLLECTION:-alerts}
    deploy:
      resources:
        limits:
          memory: 192M

  dashboard-frontend:
    build:
      context: ./dashboard/frontend
      dockerfile: Dockerfile
    container_name: dashboard-frontend
    depends_on:
      - dashboard-backend
    ports:
      - "3000:80"
    deploy:
      resources:
        limits:
          memory: 96M

  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/json
    deploy:
      resources:
        limits:
          memory: 256M

  # Optional local analysis profile; local mongo can be run under 'local-db' profile if ever needed
  mongo-local:
    image: mongo:7.0
    container_name: mongo-local
    profiles:
      - local-db
    command: mongod --wiredTigerCacheSizeGB 0.25
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    deploy:
      resources:
        limits:
          memory: 512M

  jupyterlab:
    image: jupyter/scipy-notebook:latest
    container_name: jupyterlab
    profiles:
      - analysis
    ports:
      - "8888:8888"
    volumes:
      - ./:/home/jovyan/work
    command: >
      jupyter lab --notebook-dir=/home/jovyan/work
      --ip=0.0.0.0 --port=8888
      --no-browser --allow-root
      --ServerApp.token='test'
    deploy:
      resources:
        limits:
          memory: 768M

volumes:
  spark-checkpoints:
  mongo-data: